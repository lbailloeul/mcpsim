name: DarkQuest
family: darkquest      # selects the legacy flat upsilon acceptance + plot styling

# DarkQuest / SpinQuest at FNAL: 120 GeV Main-Injector protons on the FMAG
# iron dump; a 1 x 1 m mCP detector face 40 m downstream, centred on the beam
# axis. 1e20 POT ~ the accumulated SpinQuest exposure assumed in the pbrem
# paper (5 years).
beam:
  energy_gev: 120.0
  frame: fixed_target
  n_pot: 1.0e20

# FMAG: the 5 m magnetized iron block acts as target + beam dump. SpinQuest's
# polarized NH3/ND3 cell sits upstream but is thin (a few % of an interaction
# length), so production happens in the iron. Material enters brem (luminosity
# + sigma_pA rescale, production within one interaction length) and Drell-Yan
# (the per-material cross-section table + per-nucleon normalisation); meson
# multiplicities are per POT (PYTHIA pp).
target:
  name: iron

# The detector: a 1 x 1 m face of 20 x 20 plastic bars (5 cm, 1.5 m long) —
# the layout the brem grids were generated for. Meson acceptance is computed
# for it by the Python engine from the archived PYTHIA samples (~2.5 min on the
# first run, then cached under mcpsim-output/cache); Drell-Yan uses the LO
# acceptance of this face carried by the built-in tables. The bar length feeds
# only the light-yield model (n_gamma), never the geometric acceptance.
# NOTE: the effect of the FMAG/KMAG magnetic sweeping on charged mCPs is
# whatever the legacy acceptance production assumed — it is NOT re-simulated
# by the Python engine, which propagates straight lines from the target.
detector:
  type: bar_array
  distance_m: 40.0
  bar_columns: 20
  bar_rows: 20
  bar_layers: 3
  bar_size_m: 0.05
  bar_length_m: 1.5
  face_mode: rectangular

# The published analysis modelled the acceptance as an r = 0.5 m disc at
# 40 m; the archived meson and Drell-Yan acceptance files below are for it.
# `fidelity: legacy` models this detector, so it reproduces the paper (a
# config that sets `detector:` itself keeps its own).
legacy_detector:
  type: cylindrical
  distance_m: 40.0
  radius_m: 0.5

# Detection model P = (1 - exp(-n_gamma eps^2))^a * eps^2:
#   n_gamma is DERIVED from the same light-yield calculation as the other
#            bar detectors: plastic anchored at 2.5e5 PE (eps = 1) for a 1.5 m
#            bar, scaled linearly with detector.bar_length_m -> 2.5e5 here.
#            This reproduces the pbrem paper's value exactly.
#   a = 3            three-layer coincidence
#   n_chi_threshold = 3.09  95% CL exclusion for zero background
#                    (Feldman-Cousins upper limit for 0 observed / 0 expected;
#                    arXiv:physics/9711021 Tables VI-VII. Raise it for a search
#                    with real background -- see docs/physics.md.)
sensitivity:
  scintillator: plastic
  a: 3
  n_chi_threshold: 3.09
  charge_min: 1.0e-5
  charge_max: 1.0
  n_charge: 500

channels: [meson_decay, brem, drell_yan]

data:
  # 199-mass log grid, 1 MeV - 7.4 GeV (shared with the LANL preset; SHiP
  # uses the longer mship_values_copy grid — historical, not physical).
  mass_grid: mship_values.txt
  # eVMD proton-brem grids WITH the rho/omega resonances (canonical set;
  # the archived "off_resonance" variant was a one-off test, see docs/data.md).
  # Do not naively sum brem with the PYTHIA vector-meson channel in the
  # resonance region — the resonant production is counted in both.
  brem_dir: DarkQuest-brem-backup
  brem_pattern: "Brem_120GeV_*.txt"
  # The grids carry the acceptance of this 1 x 1 m face, but the generator
  # puts the first chi at azimuth 0, so they resolve it only out to the face's
  # half-width (arctan(0.5/40) = 12.5 mrad): the corners (to 17.7 mrad) are
  # missing, and any face reaching beyond 12.5 mrad is warned.
  brem_max_theta_mrad: 12.5
  # Drell-Yan cross sections: by default the built-in LO table for the
  # configured target and beam energy (mcpsim/data/drell_yan: free-proton beam
  # on the nucleus, nCTEQ15), so `--target` changes them too. The paper's
  # MadGraph scan below (iron bound-proton nPDF for BOTH beams) is used by
  # `fidelity: legacy` and when a config sets data.dy_cross itself; it is
  # 1-column, POSITIONALLY paired with the ageo file. The acceptance file is
  # used in both cases.
  dy_cross: dy_cross_darkquest_nCTEQ15_iron.txt
  dy_material: iron        # nPDF the scan was simulated with
  dy_ageo: ageo_darkquest_nCTEQ15_iron.txt
  # Per-meson efficiency scans from the legacy DarkQuest decay pipeline
  # (decayVectorMeson.cc / decayPion.cc, r = 0.5 m disc at 40 m: the
  # legacy_detector). File names are the historical run names — see
  # docs/data.md for the full manifest. Upsilon has no scan file: it borrows
  # this run's low-mass J/psi acceptance (0.011357 for the disc) via `family`.
  acceptance:
    pi0: total_efficiency_outputdecayPionDARK.txt
    eta: total_efficiency_outputdecayEtaDARK.txt
    rho: total_efficiency_output2bodydecay-rho.txt
    omega: total_efficiency_output2bodydecay-omega.txt
    phi: total_efficiency_output2bodydecay-phi.txt
    jpsi: total_efficiency_output2body_decay-jsi.txt
